name: Rust core feature store and shadow CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test independent crates and SQLite sidecar
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets
      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
