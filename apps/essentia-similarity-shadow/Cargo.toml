[package]
name = "essentia-similarity-shadow"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Research-only local read-only similarity rank diagnostics"

[dependencies]
essentia-similarity-core = { path = "../../crates/essentia-similarity-core" }
essentia-feature-store = { path = "../../crates/essentia-feature-store" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
